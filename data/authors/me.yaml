bio: |
  Amdad Ahmed Awsaf is a PhD Candidate in STEM Education.Amdad Ahmed Awsaf is a PhD candidate 
  in the Department of Teaching and Learning at Florida International University, 
  concentrating in STEM Education. His research examines how personal, educational, and societal 
  identities shape access to, engagement in, and persistence in STEM. He employs quantitative, 
  qualitative, and mixed-method approaches to study youths' identity development across formal 
  and informal STEM learning spaces, including makerspaces and science camps, as well as the role
   of educational technologies in supporting equitable participation. His goal is to develop 
   context-specific, effective interventions that provide equitable learning opportunities and 
   help people discover and solidify their identities within STEM.

