role: PhD Candidate in STEM Education
bio: |
  Amdad Ahmed Awsaf is a PhD candidate in STEM Education in the Department of Teaching and Learning
  at Florida International University. His research examines how personal, educational, and societal
  identities shape access to, engagement in, and persistence in STEM. He uses quantitative,
  qualitative, and mixed-method approaches to study youth identity development across formal and
  informal STEM learning spaces, including makerspaces and science camps. His work also examines how
  educational technologies can support equitable STEM participation.

